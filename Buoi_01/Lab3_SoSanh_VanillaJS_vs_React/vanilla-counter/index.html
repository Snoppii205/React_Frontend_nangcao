<!DOCTYPE html>
<html lang="vi">

<head>
  <meta charset="UTF-8">
  <title>Vanilla JS Counter</title>
  <style>
    body {
      font-family: 'Segoe UI', sans-serif;
      padding: 30px;
      line-height: 1.6;
    }

    .container {
      border: 1px solid #ccc;
      padding: 20px;
      border-radius: 8px;
      width: 350px;
    }

    button {
      padding: 10px 18px;
      font-size: 16px;
      cursor: pointer;
      background: #007bff;
      color: white;
      border: none;
      border-radius: 4px;
    }

    button:hover {
      background: #0056b3;
    }

    .count-display {
      font-size: 22px;
      font-weight: bold;
      margin-left: 15px;
    }
  </style>
</head>

<body>
  <div class="container">
    <h3>Mô hình Vanilla JS (Lập trình mệnh lệnh)</h3>
    <button id="btn">Tăng số</button>
    <span class="count-display" id="count">0</span>
  </div>

  <script>
    // 1. Tìm thẻ DOM bằng Javascript
    const btn = document.getElementById('btn');
    const countSpan = document.getElementById('count');
    let count = 0;

    // 2. Lắng nghe sự kiện click và tự can thiệp cập nhật DOM
    btn.addEventListener('click', () => {
      count++;
      countSpan.textContent = count; // Phải chỉ định rõ từng bước cập nhật UI
    });
  </script>
</body>

</html>
